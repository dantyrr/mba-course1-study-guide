<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Economics Formula Sheet — MBA Course 1</title>
<style>
  body{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#111;background:#fff;
       max-width:900px;margin:0 auto;padding:28px 22px;line-height:1.45;font-size:13px}
  h1{font-size:22px;margin:0 0 4px}
  .intro{color:#444;font-size:12px;margin:0 0 18px}
  h3{font-size:14px;margin:18px 0 6px;border-bottom:1.5px solid #333;padding-bottom:3px}
  table{border-collapse:collapse;width:100%;font-size:11.5px;margin:6px 0}
  th,td{border:1px solid #999;padding:5px 7px;text-align:left;vertical-align:top}
  th{background:#efefef;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
  .formula{background:#f4f4f4;border:1px solid #bbb;border-radius:4px;padding:5px 7px;
           font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;margin:2px 0}
  .tip{background:#f2f2f2;border-left:3px solid #333;padding:7px 10px;margin:8px 0;font-size:11.5px}
  .term{font-weight:700}
  .tablewrap{overflow-x:auto}
  .toolbar{margin:0 0 14px}
  .toolbar button{font:inherit;font-weight:700;padding:8px 18px;border:1px solid #333;background:#111;
                  color:#fff;border-radius:6px;cursor:pointer}
  section{page-break-inside:avoid}
  @media print{.toolbar{display:none} body{padding:0;font-size:11px} h1{font-size:18px}}
</style>
</head>
<body>
<div class="toolbar"><button onclick="window.print()">Print / Save as PDF</button></div>
<div id="sheet">Loading…</div>
<script src="data/econ-formulas.js"></script>
<script>
  var F = window.ECON_FORMULAS;
  document.getElementById('sheet').innerHTML =
    '<h1>' + F.title + '</h1><p class="intro">' + F.intro + '</p>' +
    F.sections.map(function (s) { return '<section><h3>' + s.title + '</h3>' + s.html + '</section>'; }).join('');
</script>
</body>
</html>
